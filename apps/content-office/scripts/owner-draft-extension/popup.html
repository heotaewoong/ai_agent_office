<!doctype html><html lang="ko"><meta charset="utf-8"><title>HeoBrain 비공개 초안</title><style>body{font:14px system-ui;width:360px;padding:18px;color:#182d31}h1{font-size:20px}button{padding:10px;margin:6px 0}pre{white-space:pre-wrap;max-height:280px;overflow:auto}label{display:block;padding:12px 0}</style><h1>플랫폼에 초안만 보관</h1><p>공개·예약 발행 기능은 없습니다. 로그인은 일반 Chrome에서 직접 하세요. 기존 초안을 덮어쓰지 않습니다.</p><button id="connect">Windows 인증 연결 확인</button><label><input id="enabled" type="checkbox">승인①에서 선택한 초안 자동 처리</label><button id="run">대기 초안 확인</button><label>첫 연결 검증<select id="channel"><option value="linkedin_personal">LinkedIn</option><option value="threads_main">Threads</option><option value="tistory_main">티스토리</option><option value="naver_blog_main">네이버 블로그</option><option value="instagram_main">Instagram 메인</option><option value="instagram_english">Instagram 영어</option></select></label><button id="verify">선택한 계정의 저장·재열기 검증</button><p>원고 승인①과 채널 선택을 마친 대기 초안 1건이 필요합니다. 실제 플랫폼에 비공개 초안을 저장하는 검사입니다.</p><pre id="status" role="status">불러오는 중…</pre><p>웹 채널은 실제 계정의 저장·재열기 검증을 마쳐야 활성화됩니다. 연결 대기를 플랫폼 저장 완료로 표시하지 않습니다.</p><script type="module" src="popup.mjs"></script></html>
