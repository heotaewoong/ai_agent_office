00.0" y="1413" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">08 리드마그넷 → 구매</text><text x="800.0" y="1452" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d40">제공 페이지 → 체험 → 관련 상품</text><rect x="560" y="1545" width="480" height="110" rx="18" fill="#ffffff" stroke="#b7c6d4" stroke-width="2"/><text x="800.0" y="1593" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">09 관측·회고·개선</text><text x="800.0" y="1632" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d40">교훈 검토 → 다음 기획</text><text x="800" y="1765" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#334155">설계도 · 자동 게시/발송 연결 아님 · 주황: 사람 결정 / 초록: 독립 제작 / 회색 선: 인계</text></svg>