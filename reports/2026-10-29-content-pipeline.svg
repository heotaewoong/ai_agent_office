 marker-end="url(#a)"/><polyline points="560,1600 18,1600 18,290 560,290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="560" y="55" width="480" height="110" rx="18" fill="#ffffff" stroke="#b7c6d4" stroke-width="2"/><text x="800.0" y="103" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">01 도메인·근거·보유 자료</text><text x="800.0" y="142" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d40">경쟁과 고객 질문 / 확인·미확인</text><rect x="560" y="235" width="480" height="110" rx="18" fill="#fff1d6" stroke="#b7c6d4" stroke-width="2"/><text x="800.0" y="283" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">02 목표·독자·기획 (0)</text><text x="800.0" y="322" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d40">한 질문 · 한 행동 · 관련 상품</text><rect x="560" y="415" width="480" height="110" rx="18" fill="#ffffff" stroke="#b7c6d4" stroke-width="2"/><text x="800.0" y="463" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">03 공통 원고·검토</text><text x="800.0" y="502" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d40">조사 → 초안 → 비평 → 수정</text><rect x="560" y="595" width="480" height="100" rx="18" fill="#fff1d6" stroke="#b7c6d4" stroke-width="2"/><text x="800.0" y="643" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">04 사람이 원고 승인 ①</text><text x="800.0" y="682" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d40">판본·권리·제작 범위 고정</text><rect x="40" y="795" width="350" height="110" rx="18" fill="#e1f4ee" stroke="#b7c6d4" stroke-width="2"/><text x="215.0" y="843" text-anchor="middle" font-size="27" font-family="Malgun Gothic, sans-serif" fill="#172d40">블로그</text><text x="215.0" y="882" text-anchor="middle" font-size="22" font-family="Malgun Gothic, sans-serif" fill="#172d